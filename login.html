<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>FCIT Activities - Login</title>
<link href="style.css" rel="stylesheet"/>

</head>
<body>
<!-- ===== Header with project logo ===== -->
<header class="site-header" id="top">
<!-- Image map: clicking the logo goes to the About Us page -->
<img alt="FCIT Student Activities logo" class="logo" height="120" src="images/fcit.jpg" usemap="#logomap" width="120"/>
<map name="logomap">
<area alt="About Us" coords="0,0,120,120" href="about.html" shape="rect"/>
</map>
<h1>FCIT Student Activities Portal</h1>
<p>Faculty of Computing and Information Technology - King Abdulaziz University</p>
</header>
<!-- ===== Navigation menu ===== -->
<nav class="main-nav">
<a href="index.html">Home</a>
<a class="active" href="login.html">Login</a>
<a href="signup.html">Sign Up</a>
<a href="about.html">About Us</a>
<a href="contact.html">Contact Us</a></nav>
<div class="container">
<!-- ===== Login box ===== -->
<section class="box form-box">
<h2>Login</h2>
<!-- When the form is valid, it goes to the Home page -->
<form action="index.html" method="get">
<label for="username">Email / Username</label><br/>
<input class="field" id="username" name="username" type="text"/><br/>
<label for="password">Password</label><br/>
<input class="field" id="password" type="password"/><br/>
<label for="userType">User Type</label><br/>
<select class="field" id="userType" name="userType"><option value="">-- Select user type --</option><option value="student">Student</option><option value="instructor">Instructor</option><option value="visitor">Visitor</option></select><br/>



<input class="button" type="submit" value="Login"/>
<input class="button gray-button" type="reset" value="Reset"/>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
<p><a href="index.html">Back to Home</a></p>
</section>
</div>
<!-- ===== Footer ===== -->
<footer class="site-footer"><p><strong>FCIT Student Activities Portal</strong></p><p>Developed by Osama Al-Jabri and Ahmed Alotaibi.</p></footer>
</body>
</html>
